<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Contact us OLPHARM</title>
</head>
<body>
    
     <header>
        <h1>Contact Us</h1>
    
    </header>

   <nav>
        <a href="home.html">Home</a>
        <a href="about.html">About</a>
        <a href=" contact.html">Contact</a>
        <a href="products.html">Products</a>
    </nav>
     
     
     <main>
        <section>
            <h2>Contact Information</h2>
      <form action="#" method="post">
     <label for="full-name">Full Name:</label>
     <input type="text" id="full-name" name="full-name" placeholder="Enter your full name " required><br>

     <label for="email">Email:</label>
     <input type="email" id="email" name="email" placeholder="Enter your email address " required><br>

     
     <label for="phone-number">Phone Number</label>
     <input type="tel" id="phone-number" name="phone-number" placeholder="+251 9xxxxxxxx" required><br>
     
     <label for="address">Address</label>
     <input type="text" id="address" name="address" placeholder="Enter your location " required><br>

     <section>
         <h2>Product Requiremets</h2>
    
     <label for="products">Products Needed</label>
     <select name="products" id="products" required>
      <option value="">Choose the products you need</option>
      <option value="Medicine">Medicine</option>
      <option value="Medical Equipment">Medical Equipment</option>
      <option value="Medical Supplies">Medical Supplies</option>
      <option value="Diagnostic Products">Diagnostic Products</option>
      <option value="Other">Other</option> </select><br>
        

        <label for="product name">Product Name</label>
        <input type="text" id="product name" name="product name" placeholder="Enter the product name " required><br>
        
        <label for="quantity">Quantity</label>
        <input type="number" id="quantity" name="quantity" min="1" placeholder="Enter quantity" required><br>
      </section>

     <section>
         <h2>Payment Information</h2>
               <label for="payment-method">Payment Method</label><br>
               <select name="payment-method" id="payment-method" required>
                   <option value="">Choose a payment method</option>
                   <option value="Cash on Delivery">Cash on Delivery</option>
                   <option value="Bank Transfer">Bank Transfer</option>
                    <option value="Mobile Payment">Mobile Payment</option>
                    <option value="Other">Other</option>
               </select><br>
   
        
     <label for="additional-info">Additional Info</label><br>
        <textarea id="additional-info" name="additional-info" rows="4" cols="50" placeholder="Enter any additional information "></textarea><br>

     <button type="submit">Submit</button>
     <button type="reset">Reset</button>
       </section>
       </form>

    <section>
        <h2>Our Location</h2>
      <p><b>Visit our office</b></p>

      </section>
